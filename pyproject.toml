[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cupola"
version = "0.1.0"
description = "Debinding and sintering simulation and thermal-cycle synthesis for lithography-printed copper"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
fem = ["scikit-fem>=9"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "scikit-fem>=9", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
